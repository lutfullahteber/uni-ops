# Uni-Ops — Recommenders Configuration
# Copy this file to recommenders.yml in the project root.
# Tracks referees, what they can speak to, and request/follow-up cadence.

# Default cadence for recommender chasers (days between nudges)
default_cadence_days: 14

# Default lead time to ask before a deadline (days)
default_lead_time_days: 45

referees:
  - name: "Prof. A. Yilmaz"
    email: "a.yilmaz@example.edu"
    title: "Associate Professor, Computer Engineering"
    institution: "Your Undergrad University"
    relationship: "Capstone advisor (Karate AI project)"
    relationship_duration: "18 months"
    strength: "Deep technical (CV/ML), project ownership, independent research"
    relevant_for:
      - "Research-track MSc programs"
      - "PhD applications"
      - "Computer Vision groups"
    talking_points:
      - "Karate Action Recognition capstone — 89.82% accuracy, end-to-end pipeline"
      - "Independent debugging of YOLO pipeline; built own dataset of 10K images"
      - "Reproduced and improved 3 SOTA papers during capstone"
    asked_on: null                       # YYYY-MM-DD when you formally requested
    confirmed: false                     # true after they agree to write
    cadence_days: 14                     # days between nudges if unconfirmed/unsubmitted
    submitted_count: 0
    last_contacted: null
    notes: "Prefers contact via institutional email. Slow response — 1-2 weeks normal."

