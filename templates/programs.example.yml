# Uni-Ops — Programs Configuration
# Used by /uni-ops scan to discover relevant Bachelor/Master/PhD programs
# and by evaluation modes to score program fit.
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to programs.yml in the project root
#   2. Edit title_filter to match YOUR target degree level + fields
#   3. Add/remove universities in tracked_programs
#   4. Adjust search_queries for your preferred program aggregators
#   5. Set enabled: false on programs you've decided against

# -- Title filter --
# At least 1 positive must match AND 0 negatives must match (case-insensitive).
title_filter:
  positive:
    # Degree-level signals
    - "Master"
    - "M.Sc."
    - "MSc"
    - "MS in"
    - "MEng"
    # Field signals (CUSTOMIZE)
    - "Computer Vision"
    - "Machine Learning"
    - "Artificial Intelligence"
    - "Robotics"
    - "Data Science"
    - "Informatics"
    - "Computer Science"

  negative:
    - "Executive MBA"
    - "Part-time"
    - "Online only"
    - "Continuing Education"
    - "Certificate"
    - "Bootcamp"
    - "Diploma"                  # exclude if you want degree only

  level_filter: ["MSc", "Master", "MS", "M.Sc."]  # adjust to match target.degree_level

# -- Search queries --
# Used as WebSearch fallback when a program aggregator has no clean API.
search_queries:
  - name: "MastersPortal — CV/ML Europe"
    query: 'site:mastersportal.com "Master" "Computer Vision" OR "Machine Learning" OR "AI"'
    enabled: true

  - name: "FindAMasters — CS/AI Europe"
    query: 'site:findamasters.com "MSc" "Computer Science" OR "Artificial Intelligence"'
    enabled: true

  - name: "DAAD International Programs — Germany"
    query: 'site:daad.de "Master" "Computer Science" OR "Computer Vision" OR "AI" English-taught'
    enabled: true

  - name: "Study in Holland — MSc CS/AI"
    query: 'site:studyinholland.nl OR site:studyinnl.org "Master" "Computer Science" OR "AI"'
    enabled: true

  - name: "Erasmus Mundus Joint Masters — CV/ML"
    query: '"Erasmus Mundus Joint Master" "computer vision" OR "machine learning" OR "data science"'
    enabled: true

# -- Tracked programs --
# Concrete programs you want re-scanned on every `npm run scan`.
# Numeric fields (tuition_per_year, est_living_cost_per_year) drive Block D
# budget math in evaluation. Use the program's official currency in the
# top-level field; scoring normalizes via candidate funding.currency.
tracked_programs:

  # -- Germany --
  - name: "TU Munich — MSc Informatics"
    program_url: "https://www.cit.tum.de/en/cit/studies/degree-programs/master-informatics/"
    country: "Germany"
    city: "Munich"
    language_of_instruction: "English"
    deadline: "2026-01-15"
    tuition_per_year: 150            # EUR — public, semester contribution only
    est_living_cost_per_year: 14000
    currency: "EUR"
    funding_bundled: false
    application_fee: 75
    duration_years: 2
    required_test_scores:
      toefl_ibt_min: 88
      ielts_min: 6.5
    gpa_min: 2.5                     # German 1.0=best; convert as needed
